<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PTU Login Page</title>
  <style>
    body { font-family: Arial, sans-serif; background: linear-gradient(135deg,#1e3c72,#2a5298); height:100vh; display:flex; align-items:center; justify-content:center; margin:0;}
    .box { background:#fff; padding:28px; border-radius:12px; width:360px; text-align:center; box-shadow:0 6px 20px rgba(0,0,0,0.2);}
    input { width:100%; padding:10px; margin:8px 0; border-radius:8px; border:1px solid #ccc;}
    button { width:100%; padding:10px; background:#2a5298; color:#fff; border:none; border-radius:8px; cursor:pointer;}
    .error { color:red; margin-top:8px; font-weight:600;}
  </style>
</head>
<body>
  <div class="box">
    <h2>🔐 PTU Fees Collection System</h2>
    <form method="POST">
      <input name="userid" placeholder="User ID" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </div>
</body>
</html>
